services:
  bugbusters:
    build: .
    image: bugbusters
    container_name: bugbusters
    ports:
      - "127.0.0.1:8080:8080"   # only this laptop can reach the engine
    volumes:
      # Drop problem scripts (.m) and data files (.mat, .csv) in this folder.
      - ./files:/files
    environment:
      BB_TIMEOUT: "15"          # seconds per run
    cap_add:
      - NET_ADMIN               # lets the server cut participant code off the network
    restart: unless-stopped
