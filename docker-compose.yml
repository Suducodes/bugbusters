services:
  bugbusters:
    build: .
    image: bugbusters
    container_name: bugbusters
    ports:
      - "8080:8080"
    volumes:
      # Drop problem scripts (.m) and data files (.mat, .csv) in this folder.
      - ./files:/files
    env_file:
      - path: .env              # BB_UNLOCK_PIN / BB_ORGANISER_PIN live here (not committed)
        required: false
    environment:
      BB_TIMEOUT: "15"          # seconds per run
    cap_add:
      - NET_ADMIN               # lets the server cut participant code off the network
    restart: unless-stopped
